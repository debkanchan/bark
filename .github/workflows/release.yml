name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.5

      - name: Run all tests
        run: go test -v ./...

      - name: Run tests with coverage
        run: go test -cover ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
          - goos: darwin
            goarch: amd64
            os: macos-15-large
          - goos: darwin
            goarch: arm64
            os: macos-latest
          - goos: windows
            goarch: amd64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.5

      - name: Install ARM cross-compiler
        if: matrix.cc != ''
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          OUTPUT_NAME="bark-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          go build -ldflags="-s -w" -o "$OUTPUT_NAME" ./cmd/bark

          # Create checksum for binary
          if command -v sha256sum &>/dev/null; then
            sha256sum "$OUTPUT_NAME" > "${OUTPUT_NAME}.sha256"
          else
            shasum -a 256 "$OUTPUT_NAME" > "${OUTPUT_NAME}.sha256"
          fi

          # Create tar.gz archive
          ARCHIVE_NAME="bark-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$OUTPUT_NAME"

          # Create checksum for archive
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

          echo "Built: $OUTPUT_NAME"
          ls -lh "$OUTPUT_NAME" "$ARCHIVE_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bark-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bark-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure
        run: |
          echo "Downloaded artifacts:"
          ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -type f -exec cp {} ./release/ \;
          ls -lh ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
          body: |
            ## 🐕 Bark Release ${{ github.ref_name }}

            Cross-platform binaries for detecting BARK comments in your code.

            ### 📦 Installation

            #### Recommended

            ```bash
            # Homebrew (macOS / Linux)
            brew install debkanchan/tap/bark

            # npm (any platform with Node.js)
            npm install -g @debkanchan/bark
            ```

            <details>
            <summary>Manual binary download</summary>

            #### Linux (AMD64)
            ```bash
            curl -L https://github.com/debkanchan/bark/releases/download/${{ github.ref_name }}/bark-linux-amd64.tar.gz -o bark.tar.gz
            tar -xzf bark.tar.gz
            chmod +x bark-linux-amd64
            sudo mv bark-linux-amd64 /usr/local/bin/bark
            ```

            #### macOS (Apple Silicon - M1/M2/M3)
            ```bash
            curl -L https://github.com/debkanchan/bark/releases/download/${{ github.ref_name }}/bark-darwin-arm64.tar.gz -o bark.tar.gz
            tar -xzf bark.tar.gz
            chmod +x bark-darwin-arm64
            sudo mv bark-darwin-arm64 /usr/local/bin/bark
            ```

            #### macOS (Intel)
            ```bash
            curl -L https://github.com/debkanchan/bark/releases/download/${{ github.ref_name }}/bark-darwin-amd64.tar.gz -o bark.tar.gz
            tar -xzf bark.tar.gz
            chmod +x bark-darwin-amd64
            sudo mv bark-darwin-amd64 /usr/local/bin/bark
            ```

            #### Windows (PowerShell)
            ```powershell
            # Download tar.gz
            Invoke-WebRequest -Uri "https://github.com/debkanchan/bark/releases/download/${{ github.ref_name }}/bark-windows-amd64.tar.gz" -OutFile "bark.tar.gz"
            # Extract using tar (available in Windows 10+)
            tar -xzf bark.tar.gz
            # Move to a directory in your PATH
            Move-Item bark-windows-amd64.exe C:\Windows\System32\bark.exe
            ```

            Or download raw binary directly:
            ```bash
            # Linux AMD64 (direct binary)
            curl -L https://github.com/debkanchan/bark/releases/download/${{ github.ref_name }}/bark-linux-amd64 -o bark
            chmod +x bark
            sudo mv bark /usr/local/bin/
            ```

            </details>

            #### Or install from source (requires a C compiler — CGO)
            ```bash
            go install github.com/debkanchan/bark/cmd/bark@${{ github.ref_name }}
            ```

            ### ✅ Verify Installation
            ```bash
            bark --help
            bark .
            ```

            ### 🔒 Verify Checksums
            Download the `.sha256` file and verify:
            ```bash
            sha256sum -c bark-linux-amd64.sha256
            ```

            ### 📋 Supported Platforms
            - Linux AMD64
            - Linux ARM64
            - macOS AMD64 (Intel)
            - macOS ARM64 (Apple Silicon)
            - Windows AMD64

            ---

            **Full documentation:** https://github.com/debkanchan/bark#readme

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check NPM_TOKEN
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Resolve version
        if: steps.guard.outputs.enabled == 'true'
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp versions and stage binaries
        if: steps.guard.outputs.enabled == 'true'
        run: node npm/build.mjs "${{ steps.ver.outputs.version }}" ./artifacts

      - name: Publish platform packages, then main package
        if: steps.guard.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for d in bark-linux-x64 bark-linux-arm64 bark-darwin-x64 bark-darwin-arm64 bark-win32-x64; do
            echo "publishing @debkanchan/$d"
            npm publish --access public "./npm/$d"
          done
          echo "publishing @debkanchan/bark"
          npm publish --access public ./npm/bark

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN secret not set — skipping Homebrew tap update."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 20

      - name: Download all artifacts
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Resolve version
        if: steps.guard.outputs.enabled == 'true'
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        if: steps.guard.outputs.enabled == 'true'
        run: node scripts/gen-homebrew-formula.mjs "${{ steps.ver.outputs.version }}" ./artifacts ./bark.rb

      - name: Commit formula to tap repo
        if: steps.guard.outputs.enabled == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/debkanchan/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ./bark.rb tap/Formula/bark.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bark.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "bark ${{ steps.ver.outputs.version }}"
            git push
          fi
